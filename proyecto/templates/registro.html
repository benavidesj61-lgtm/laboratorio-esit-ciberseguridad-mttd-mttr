<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Práctica de código seguro, autenticación y métricas MTTD y MTTR">
    <title>Registro de usuarios | Laboratorio de ciberseguridad</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">LABORATORIO DE CIBERSEGURIDAD</a>
            <nav class="nav" aria-label="Navegación principal">
                <a href="/">Inicio</a>
                <a href="/registro">Registro</a>
                <a href="/login">Acceso</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="panel">
            <span class="eyebrow">Crear cuenta</span>
            <h1>Registro de usuarios</h1>
            <p>Completa los datos para crear una cuenta de prueba.</p>
            <form method="POST" action="/registro">
                <label for="usuario">Nombre de usuario</label>
                <input id="usuario" type="text" name="usuario" placeholder="Ej.: usuario_01" minlength="4" maxlength="20" pattern="[A-Za-z0-9_]{4,20}" autocomplete="username" required>
                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="correo" placeholder="Ej.: prueba@example.com" autocomplete="email" required>
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
                <button type="submit">Registrar usuario</button>
            </form>
            <p class="note">¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a>.</p>
        </section>
    </main>
    <footer>Lenguajes de Programación con Aspectos de Seguridad · Práctica académica</footer>
</body>
</html>
