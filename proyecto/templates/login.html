<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Práctica de código seguro, autenticación y métricas MTTD y MTTR">
    <title>Inicio de sesión | Laboratorio de ciberseguridad</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">LABORATORIO DE CIBERSEGURIDAD</a>
            <nav class="nav" aria-label="Navegación principal">
                <a href="/">Inicio</a>
                <a href="/registro">Registro</a>
                <a href="/login">Acceso</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="panel">
            <span class="eyebrow">Acceso</span>
            <h1>Iniciar sesión</h1>
            <p>Utiliza la cuenta que registraste para comprobar el acceso.</p>
            <form method="POST" action="/login">
                <label for="usuario">Nombre de usuario</label>
                <input id="usuario" type="text" name="usuario" placeholder="Ej.: usuario_01" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
                <button type="submit">Ingresar</button>
            </form>
            <p class="note">¿Aún no tienes una cuenta? <a href="/registro">Regístrate aquí</a>.</p>
        </section>
    </main>
    <footer>Lenguajes de Programación con Aspectos de Seguridad · Práctica académica</footer>
</body>
</html>
